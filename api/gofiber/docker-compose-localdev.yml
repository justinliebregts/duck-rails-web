name: gunraiders-classic

networks:
  grc-net:
    name: grc-net

services:
  ## API
  gofiber2:
    container_name: grc_backend_compiled
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      #      - DEPLOY_ENV=development
      - TZ=UTC
    ports:
      - "8090:3000"
      - "8098:8080"
    #    volumes:
    #      - ../gofiber:/app
    networks:
      - grc-net

  ## admin
  admin:
    container_name: grc_admin
    image: node:16-alpine
    restart: unless-stopped
    ports:
      - "8002:8080"
    environment:
      - TZ=UTC
      - CHOKIDAR_USEPOLLING=true
    networks:
      - grc-net
    volumes:
      - ../../admin:/admin
      # Create an anonymous volume to prevent host's node_modules from conflicting
      - /admin/node_modules
    command: >
      /bin/sh -c " apk add build-base && cd /admin && npm install &&  npx vue-demi-switch 2 &&  npm run serve "

  ### MySQL as Database
  dbro:
    container_name: grc_database_ro
    image: "mysql:8.3"
    #platform: linux/amd64
    restart: unless-stopped
    ports:
      - "32770:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_ROOT_PASSWORD=local_root_pass_ro
      - MYSQL_DATABASE=gunraiders_classic
      - MYSQL_USER=grcuserro
      - MYSQL_PASSWORD=passwordro
      - TZ=UTC
    networks:
      - grc-net
    volumes:
      - ../sql/structure_classic.sql:/docker-entrypoint-initdb.d/0_structure_classic.sql:ro

  ## Redis GUI
  cachegui:
    platform: linux/amd64
    container_name: grc_cache_editor
    #    image: marian/rebrow
    image: rediscommander/redis-commander
    restart: unless-stopped
    ports:
      #      - "5001:5001"
      - "5002:8081" # redis-commander
    environment:
      - TZ=UTC
      - REDIS_HOSTS=cache
    networks:
      - grc-net
    depends_on:
      - "cache"
    #    volumes:
    #      - ./misc/rebrow/login.template:/app/templates/login.html
    links:
      - "cache:cache"

  #

  ###
  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: grc_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl:enabled=false
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=local_pass
    ports:
      - 9201:9200
      - 9301:9300
    networks:
      - grc-net
  kibana:
    image: kibana:8.12.2
    container_name: grc_kibana
    depends_on:
      - elasticsearch
    links:
      - elasticsearch:elasticsearch
    ports:
      - 5602:5601
      #    volumes:
      # 此 config 的設定可以看下方的設定
      #      - ./config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    networks:
      - grc-net
